<text class="tag" x="30" y="128">Real-time messaging</text>
<text class="desc" x="30" y="164">One-to-one chat that arrives instantly</text><text class="desc" x="30" y="186">over WebSockets, with live presence and</text><text class="desc" x="30" y="208">JWT auth in httpOnly cookies.</text>
