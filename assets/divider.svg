<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 60" width="1280" height="60" role="img" aria-label=""><defs></defs><style>
.t{font-family:IS,Georgia,serif}.ti{font-family:ISI,IS,Georgia,serif;font-style:italic}.s{font-family:GS,system-ui,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--d,60s) linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin var(--d,60s) linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw var(--d,3s) ease-in-out var(--t,0s) infinite alternate}@keyframes tw{from{opacity:.35}to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse var(--d,4s) ease-in-out var(--t,0s) infinite alternate}
@keyframes pulse{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
.flow{animation:flow var(--d,6s) linear infinite}@keyframes flow{to{stroke-dashoffset:var(--o,-200)}}
.rise{opacity:0;animation:rise 1.4s cubic-bezier(.22,1,.36,1) var(--t,0s) forwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}}</style><path d="M0,30 C80,10 160,50 240,30 S400,10 480,30 S640,50 720,30 S880,10 960,30 S1120,50 1280,30" fill="none" stroke="#1B3A7A" stroke-width="10" stroke-linecap="round"/><path d="M0,30 C80,10 160,50 240,30 S400,10 480,30 S640,50 720,30 S880,10 960,30 S1120,50 1280,30" fill="none" stroke="#3E73C4" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round" class="flow" style="--d:4s;--o:-240"/><path d="M0,30 C80,10 160,50 240,30 S400,10 480,30 S640,50 720,30 S880,10 960,30 S1120,50 1280,30" fill="none" stroke="#F4D35E" stroke-width="2.5" stroke-dasharray="6 34" stroke-linecap="round" class="flow" style="--d:3s;--o:-240"/><g><circle r="9" fill="#FFF6CC"/><circle r="18" fill="#F4D35E" opacity=".25"/><animateMotion dur="7s" repeatCount="indefinite" path="M0,30 C80,10 160,50 240,30 S400,10 480,30 S640,50 720,30 S880,10 960,30 S1120,50 1280,30"/></g></svg>