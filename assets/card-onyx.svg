<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Onyx: payments set in stone. A MERN payment gateway with idempotent APIs, a double-entry ledger and reliable webhooks.">
